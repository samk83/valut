plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vaultcore'
version = '0.1.0'

android {
  namespace "expo.modules.vaultcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    // The shared security core (repo root /core) is compiled straight into this module,
    // so the app and the JVM tests run exactly the same code.
    main.java.srcDirs += "$projectDir/../../../../core/src/main/kotlin"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
  // Google's own Play Billing library (1.1 Premium). No third-party payment SDK.
  implementation "com.android.billingclient:billing:8.0.0"
  // Photo search: Google ML Kit with the models bundled in the app (works offline, nothing is
  // downloaded or sent). Text in Latin, Korean, Japanese, Chinese and Devanagari script, and
  // on-device image labels.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
  implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
  implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"
  implementation "com.google.mlkit:image-labeling:17.0.9"
}
